services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recruitment}
    ports: ["5433:5432"]
    volumes: ["recruitment_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  recruitment_data:
